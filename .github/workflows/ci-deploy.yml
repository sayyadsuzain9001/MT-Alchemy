name: Test and deploy

# On every push to main: analyze, run the tests, build the web app and
# publish it to GitHub Pages. Pull requests only run the checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-and-deploy:
    name: Build and deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check deployment secrets
        id: secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::Deploy skipped: add the FIREBASE_* repository secrets and enable Pages (README > Deploy with GitHub Actions)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        if: steps.secrets.outputs.ready == 'true'
        run: flutter pub get

      # Keys come from repository secrets (Settings > Secrets and variables >
      # Actions). Without them the deploy steps are skipped with a warning.
      - name: Build web app
        if: steps.secrets.outputs.ready == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_PROJECT_ID.firebaseapp.com" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_PROJECT_ID.firebasestorage.app" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=PAYMENTS_API_URL="$PAYMENTS_API_URL"
          cp build/web/index.html build/web/404.html

      - name: Configure Pages
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
