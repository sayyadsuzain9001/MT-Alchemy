name: publicwebsite
description: MT Alchemy Member 1 corporate website prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  shared_preferences: ^2.5.6
  web: ^1.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  http: ^1.6.0
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/stock/
    - assets/downloads/
